<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>THUMDER</title>
  <base href="/">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <!-- What the page may load (SEG-03): its own code, the services of Firebase and the images of GitHub and Google.
       Styles inline: Angular, Monaco and PixiJS write them. No eval (PixiJS uses @pixi/unsafe-eval) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com https://*.googleusercontent.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://github.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" type="image/x-icon" href="assets/icons/faviconWhite.ico">
  <style>
    .loader {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader span {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      border: 2px solid #222;
      pointer-events: none;
      animation: animate 5s linear infinite;
    }

    .loader span:nth-child(1) {
      border-radius: 38% 62% 64% 36% / 43% 35% 65% 57%;
    }

    .loader span:nth-child(2) {
      animation-direction: reverse;
      border-radius: 41% 59% 40% 60% / 65% 66% 34% 35%;
    }

    .loader span:nth-child(3) {
      animation-duration: 3s;
      border-radius: 73% 27% 56% 44% / 57% 74% 26% 43%;
    }

    @keyframes animate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .loader h1 {
      color: #222;
      font-weight: 500;
      font-family: monospace, consolas, serif;
      font-size: 1.5em;
    }

    .body-init {
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

  </style>
</head>

<body class="body-init">
<app-root>
  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
    <h1>Loading...</h1>
  </div>
</app-root>
</body>

</html>
