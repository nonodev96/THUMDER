<div thumderCard class="card" id="Code-card"
     (expanded)="resizeCard('75vh')" (minimized)="resizeCard('75vh')" (maximized)="resizeCard('100%')">
  <div class="card-header">
    <h3 class="card-title">
      <!-- Drag button -->
      <ng-content></ng-content>

      <span thumderCardWidget="collapse">{{'MACHINE.CODE' | translate}}</span>
    </h3>
    <div class="card-tools">
      <button type="button" class="btn btn-tool" [title]="'FORMS.REFRESH' | translate" [attr.aria-label]="'FORMS.REFRESH' | translate" (click)="refresh()">
        <i class="fas fa-sync-alt" aria-hidden="true"></i>
      </button>

      <button type="button" class="btn btn-tool" thumderCardWidget="maximize">
        <i class="fas fa-expand" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-tool" thumderCardWidget="collapse">
        <i class="fas fa-minus" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="card-body">
    <thumder-virtual-table [rows]="rows()" [columns]="displayedColumnsMemory" [height]="maxHeightCard" [itemSize]="32" minWidth="760px"
      [rowClass]="rowClass" [label]="'MACHINE.CODE' | translate" [trackBy]="trackByIndex">
      <ng-template thumderColumn="Address" [header]="'MACHINE.ADDRESS' | translate" width="minmax(7rem, 1fr)" let-row>{{ row.address }}</ng-template>
      <ng-template thumderColumn="Text" [header]="'MACHINE.TEXT' | translate" width="minmax(6rem, 1fr)" let-row>{{ row.text }}</ng-template>
      <ng-template thumderColumn="Binary" [header]="'MACHINE.BINARY' | translate" width="minmax(19rem, 3fr)" let-row>{{ row.code | from_base_to_base: {fillString: "0", maxLength: 32, from_base: 16, to_base: 2} }}</ng-template>
      <ng-template thumderColumn="Hexadecimal" [header]="'MACHINE.HEXADECIMAL' | translate" width="minmax(7rem, 1fr)" let-row>{{ row.code }}</ng-template>
      <ng-template thumderColumn="Stage" [header]="'MACHINE.STAGE' | translate" width="minmax(4.5rem, 1fr)" let-row>{{ stages().get(row.address) ?? '' }}</ng-template>
      <ng-template thumderColumn="Instruction" [header]="'MACHINE.INSTRUCTION' | translate" width="minmax(10rem, 2fr)" let-row>{{ row.instruction }}</ng-template>
    </thumder-virtual-table>
  </div>

  <div class="card-footer">

  </div>
</div>
