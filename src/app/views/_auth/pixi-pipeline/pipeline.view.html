<div thumderCard class="card" id="pixiCardPipeline">
  <div class="card-header">
    <h3 class="card-title">
      <!-- Drag button -->
      <ng-content></ng-content>

      <span thumderCardWidget="collapse">{{'MACHINE.PIPELINE' | translate}}</span>
    </h3>
    <div class="card-tools">
      <button type="button" class="btn btn-tool" [title]="'MACHINE.ZOOM_OUT' | translate" [attr.aria-label]="'MACHINE.ZOOM_OUT' | translate"
        (click)="pixi_PipelineComponent.zoomBy(1 / 1.25)">
        <i class="fas fa-search-minus" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-tool" [title]="'MACHINE.ZOOM_RESET' | translate" [attr.aria-label]="'MACHINE.ZOOM_RESET' | translate"
        (click)="pixi_PipelineComponent.resetZoom()">
        <i class="fas fa-search" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-tool" [title]="'MACHINE.ZOOM_IN' | translate" [attr.aria-label]="'MACHINE.ZOOM_IN' | translate"
        (click)="pixi_PipelineComponent.zoomBy(1.25)">
        <i class="fas fa-search-plus" aria-hidden="true"></i>
      </button>

      <button type="button" class="btn btn-tool" thumderCardWidget="maximize">
        <i class="fas fa-expand" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-tool" thumderCardWidget="collapse">
        <i class="fas fa-minus" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <div class="card-body">
    <THUMDER-pixi-pipeline></THUMDER-pixi-pipeline>
  </div>
  <!-- The pipeline in text (A11Y-01): what each stage and each unit does in this cycle -->
  <details class="card-footer pipeline-footer thumder-details--scroll" thumderDetails="pipeline">
    <summary>{{ 'DETAILS.STAGES' | translate }}</summary>
    <div id="pipelineText" aria-live="polite">
      <thumder-pipeline-stages></thumder-pipeline-stages>
  </div>
  </details>
</div>
