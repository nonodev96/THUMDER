<div thumderCard class="card">
  <div class="card-header">
    <h3 class="card-title">{{ 'LOGGER.TITLE' | translate }}</h3>
    <div class="card-tools">
      <button type="button" class="btn btn-tool" (click)="test()" [title]="'LOGGER.SHOW_LAST' | translate" [attr.aria-label]="'LOGGER.SHOW_LAST' | translate">
        <i class="fas fa-bug" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-tool" thumderCardWidget="maximize">
        <i class="fas fa-expand" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-tool" thumderCardWidget="collapse">
        <i class="fas fa-minus" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="card-body">
    <div id="ide-console">
      <THUMDER-xterm [data]="text" (onKey)="onKey($event)"></THUMDER-xterm>
    </div>
  </div>

  <div class="card-footer">
  </div>
</div>
