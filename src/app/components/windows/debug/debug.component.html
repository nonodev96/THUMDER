<div class="card" id="card-debug" cdkDrag>
  <div class="card-header">
    <h3 class="card-title">
      <button type="button" class="btn btn-tool" cdkDragHandle>
        <i class="fas fa-arrows-alt" aria-hidden="true"></i>
      </button>
      {{ "DEBUG" | translate }}
    </h3>

    <div class="card-tools">
      <button type="button" class="btn btn-tool" data-card-widget="collapse">
        <i class="fas fa-minus" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-tool" data-card-widget="remove" (click)="globals.showDebug=!globals.showDebug">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <div class="card-body card-font-console">@for (line of private_logger; track line) {
    {{line}}<br>
  }</div>
  <div class="card-footer">
    {{"URL: " + router.url}}
  </div>
</div>
