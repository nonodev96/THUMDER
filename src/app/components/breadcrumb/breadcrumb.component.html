@if (menuItemsLoaded | async) {
  <nav [attr.aria-label]="'BREADCRUMB.NAV' | translate">
    <ol class="breadcrumb float-sm-right">
      @for (item of menuItems; track $index; let last = $last) {
        <li class="breadcrumb-item" [class.active]="last" [attr.aria-current]="last ? 'page' : null">{{ labelOf(item) | translate }}</li>
      }
    </ol>
  </nav>
}
