name: Build/release

# A tag v* publishes a draft release with the desktop applications of the three systems (CI-03):
# Linux (AppImage), Windows (installer and portable) and macOS (dmg and zip), with the latest*.yml files of
# electron-builder for the automatic updates and the notes of CHANGELOG.md (scripts/release-notes.mjs). The binaries
# are not signed for Windows nor macOS (there are no certificates): the notes say so.
#
# The application of Android (AAB for Google Play and APK to install by hand) goes too when the repository has the key
# that signs it (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD if it differs;
# and GOOGLE_SERVICES_JSON for the native sign-in): docs/movil.md. iOS is built in Xcode or in TestFlight (docs/movil.md).
#
# The supply chain (README.md, «Verificar las descargas»):
# - Each binary has a provenance attestation (SLSA v1, in the in-toto format) and an attestation of the SBOM, signed
#   with Sigstore through the identity of this workflow (no keys): `gh attestation verify <file> --repo nonodev96/THUMDER`.
# - The release has the SBOM (CycloneDX and SPDX, made with Syft) and the Sigstore bundles of the attestations, to verify
#   them with cosign too.
# - The actions are pinned by their commit (Dependabot proposes their new versions: .github/dependabot.yml).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The SBOM of THUMDER, before anything is installed: every package of pnpm-lock.yaml (the ones of the application,
      # Electron among them, and the ones to build and test it) and the actions of the workflows
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: THUMDER-v${{ steps.version.outputs.version }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: THUMDER-v${{ steps.version.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Release notes
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create Release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "THUMDER $GITHUB_REF_NAME" --notes-file release-notes.md --draft \
            "THUMDER-v$VERSION-sbom.cdx.json" "THUMDER-v$VERSION-sbom.spdx.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      # The binaries of each system attest it
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: THUMDER-v${{ steps.version.outputs.version }}-sbom.cdx.json
          retention-days: 7

  release:
    name: Build And Upload Release (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      # The assets of the release
      contents: write
      # The OIDC token of the workflow, for the short-lived certificate of Sigstore that signs the attestations
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Production environment
        shell: bash
        run: echo "$ENVIRONMENT_PRODUCTION" | base64 --decode > src/environments/environment.production.ts
        env:
          ENVIRONMENT_PRODUCTION: ${{ secrets.ANGULAR_ENVIROTMENT_PRODUCTION }}

      - run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        # Without certificates electron-builder does not try to sign (macOS)
        run: pnpm run build:prod && pnpm exec electron-builder build --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Binaries of this system
        id: binaries
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.AppImage release/*.exe release/*.dmg release/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::electron-builder left no binaries in release/"
            exit 1
          fi
          { echo "paths<<EOF"; printf '%s\n' "${files[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "system=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Where each binary comes from: this repository, this commit and this workflow (SLSA build provenance)
      - name: Provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.binaries.outputs.paths }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sbom

      # What each binary is made of
      - name: SBOM attestation
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.binaries.outputs.paths }}
          sbom-path: THUMDER-v${{ env.VERSION }}-sbom.cdx.json

      # The Sigstore bundles of both attestations, to verify the binaries with cosign without the CLI of GitHub
      - name: Sigstore bundles
        shell: bash
        run: |
          unix() { cygpath -u "$1" 2>/dev/null || echo "$1"; }
          cp "$(unix "$PROVENANCE")" "release/THUMDER-v$VERSION-$SYSTEM-provenance.sigstore.json"
          cp "$(unix "$SBOM")" "release/THUMDER-v$VERSION-$SYSTEM-sbom.sigstore.json"
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
          SYSTEM: ${{ steps.binaries.outputs.system }}

      - name: Upload Release Assets
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.AppImage release/*.exe release/*.dmg release/*.zip release/*.yml release/*.blockmap release/*.sigstore.json)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Build And Upload Release (Android)
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Without the key of Android
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: the application of Android is not built (docs/movil.md)"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          submodules: recursive

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: env.ANDROID_KEYSTORE_BASE64 != ''

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: env.ANDROID_KEYSTORE_BASE64 != ''

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The keys of Firebase (as in the web) and, if it is there, its configuration for the native sign-in
      - name: Production environment
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ENVIRONMENT_PRODUCTION" | base64 --decode > src/environments/environment.production.ts
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > src-mobile/android/app/google-services.json
          else
            echo "::notice::No GOOGLE_SERVICES_JSON secret: the application signs in only with email and password"
          fi
        env:
          ENVIRONMENT_PRODUCTION: ${{ secrets.ANGULAR_ENVIROTMENT_PRODUCTION }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - run: pnpm install --frozen-lockfile
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - run: pnpm run mobile:build
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # Signed with the key of the repository (src-mobile/android/app/build.gradle reads it from the environment)
      - name: Build
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: src-mobile/android
        run: |
          # The secret as it is copied from a terminal: line breaks, spaces or the "%" that zsh shows at the end of
          # `base64 -w0` do not count (they are not base64)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/thumder.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/thumder.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The key of ANDROID_KEYSTORE_BASE64 does not open with ANDROID_KEYSTORE_PASSWORD, or has no key called ANDROID_KEY_ALIAS (docs/movil.md)"
            exit 1
          fi
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/thumder.jks" ./gradlew bundleRelease assembleRelease --console=plain
          mkdir -p ../../release
          cp app/build/outputs/bundle/release/app-release.aab "../../release/THUMDER-v$VERSION-android.aab"
          cp app/build/outputs/apk/release/app-release.apk "../../release/THUMDER-v$VERSION-android.apk"
          rm "$RUNNER_TEMP/thumder.jks"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Provenance attestation
        id: provenance
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/THUMDER-v${{ env.VERSION }}-android.*

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: sbom

      - name: SBOM attestation
        id: sbom
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/THUMDER-v${{ env.VERSION }}-android.*
          sbom-path: THUMDER-v${{ env.VERSION }}-sbom.cdx.json

      - name: Upload Release Assets
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cp "$PROVENANCE" "release/THUMDER-v$VERSION-android-provenance.sigstore.json"
          cp "$SBOM" "release/THUMDER-v$VERSION-android-sbom.sigstore.json"
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "release/THUMDER-v$VERSION-android.apk" "release/THUMDER-v$VERSION-android.aab" \
            "release/THUMDER-v$VERSION-android-provenance.sigstore.json" "release/THUMDER-v$VERSION-android-sbom.sigstore.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
