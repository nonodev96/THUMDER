name: Build/release

# A tag v* publishes a draft release with the desktop applications of the three systems (CI-03):
# Linux (AppImage), Windows (installer and portable) and macOS (dmg and zip), with the latest*.yml files of
# electron-builder for the automatic updates and the notes of CHANGELOG.md (scripts/release-notes.mjs). The binaries
# are not signed (there are no certificates): the notes say so.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create Release
        run: gh release create "$GITHUB_REF_NAME" --title "THUMDER $GITHUB_REF_NAME" --notes-file release-notes.md --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build And Upload Release (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Production environment
        shell: bash
        run: echo "$ENVIRONMENT_PRODUCTION" | base64 --decode > src/environments/environment.production.ts
        env:
          ENVIRONMENT_PRODUCTION: ${{ secrets.ANGULAR_ENVIROTMENT_PRODUCTION }}

      - run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        # Without certificates electron-builder does not try to sign (macOS)
        run: pnpm run build:prod && pnpm exec electron-builder build --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Release Assets
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.AppImage release/*.exe release/*.dmg release/*.zip release/*.yml release/*.blockmap)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
